[pytest]
# ── Test discovery ────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers ───────────────────────────────────────────────────────────
# llm         – requires a live Groq API call; excluded from default run
# integration – requires PostgreSQL + Redis (provided as CI service containers)
# slow        – SentenceTransformer embedding / concurrency tests
# unit        – purely in-memory, no I/O
markers =
    llm: marks tests that require a live Groq API call (skip with `-m "not llm"`)
    integration: marks tests requiring PostgreSQL and/or Redis
    slow: marks tests that are slower than normal (e.g. embedding generation)
    unit: marks purely in-memory unit tests with no external I/O

# ── Default run ───────────────────────────────────────────────────────
# Running `pytest` alone excludes live-LLM tests so it is safe without
# GROQ_API_KEY.  Use `pytest -m llm` to run LLM-dependent tests.
addopts = -m "not llm" -v --tb=short

# ── pytest-asyncio ────────────────────────────────────────────────────
# No async tests in this project; set function scope explicitly to
# silence the PytestDeprecationWarning from pytest-asyncio >= 0.24.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# ── Warning filters ───────────────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
