name: SupportFlow CI

# ── Triggers ──────────────────────────────────────────────────────────
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# ── Jobs ──────────────────────────────────────────────────────────────
jobs:
  test:
    name: Deterministic test suite
    runs-on: ubuntu-latest

    # ── Service containers ─────────────────────────────────────────
    # PostgreSQL with the pgvector extension, and Redis 7.
    # These match the versions in docker-compose.yml used for local dev.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportflow_user
          POSTGRES_PASSWORD: supportflow_password
          POSTGRES_DB: supportflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow_user -d supportflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ── Environment ────────────────────────────────────────────────
    env:
      # Test database — separate from the development database.
      # No GROQ_API_KEY: the default test suite is fully deterministic.
      DATABASE_URL: postgresql://supportflow_user:supportflow_password@localhost:5432/supportflow_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET: ci_test_secret_supportflow_stage8

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── 3. Install dependencies ──────────────────────────────────
      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # ── 4. Enable pgvector on the test database ───────────────────
      # The pgvector/pgvector:pg16 image ships the extension but it must
      # be enabled per-database before SQLAlchemy creates the tables.
      - name: Enable pgvector extension
        run: |
          PGPASSWORD=supportflow_password psql \
            -h localhost -U supportflow_user -d supportflow_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # ── 5. Run deterministic test suite ──────────────────────────
      # `pytest` uses addopts = -m "not llm" from pytest.ini, so no
      # live Groq calls are made.  GROQ_API_KEY is intentionally absent.
      # 
      # Note: Tests use Base.metadata.create_all() for now. Migration
      # testing will be added after verifying the migration strategy.
      - name: Run deterministic tests
        run: |
          pytest --tb=short -q

      # ── 6. Optional: live-LLM tests (skipped unless secret present) ──
      # These are only executed when GROQ_API_KEY is configured as a
      # repository secret.  They are never required for CI to pass.
      # To enable: add GROQ_API_KEY to GitHub repository secrets.
      - name: Run live-LLM tests (optional)
        if: ${{ secrets.GROQ_API_KEY != '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest -m llm --tb=short -q
        continue-on-error: true

  docker:
    name: Docker build and security scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx ──────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Build Docker image ────────────────────────────────────
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          load: true
          tags: supportflow:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 4. Verify non-root user ──────────────────────────────────
      - name: Verify non-root user
        run: |
          USER_ID=$(docker run --rm supportflow:test id -u)
          if [ "$USER_ID" = "0" ]; then
            echo "❌ ERROR: Container runs as root user"
            exit 1
          fi
          echo "✅ Container runs as non-root user (UID: $USER_ID)"

      # ── 5. Test health endpoint ──────────────────────────────────
      - name: Test health endpoint
        run: |
          docker run -d --name test-api \
            -e DATABASE_URL=postgresql://user:pass@localhost:5432/db \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e OPENAI_API_KEY=test \
            -e JWT_SECRET_KEY=test-secret-key-for-ci-minimum-32-characters-long \
            -e SERVICE_TYPE=api \
            -p 8000:8000 \
            supportflow:test
          
          sleep 10
          
          # Test liveness endpoint (should always succeed)
          if curl -f http://localhost:8000/health/live; then
            echo "✅ Liveness endpoint works"
          else
            echo "❌ Liveness endpoint failed"
            docker logs test-api
            exit 1
          fi
          
          docker stop test-api
          docker rm test-api

      # ── 6. Check for secrets in image ────────────────────────────
      - name: Check for secrets in image
        run: |
          echo "🔍 Scanning image for potential secrets..."
          docker run --rm supportflow:test find /app -type f -name "*.env" 2>/dev/null && {
            echo "❌ ERROR: .env files found in image!"
            exit 1
          } || echo "✅ No .env files in image"
          
          # Check for common secret patterns in environment
          docker run --rm supportflow:test env | grep -E "(SECRET|PASSWORD|TOKEN|KEY)=" | grep -v "JWT_SECRET_KEY" && {
            echo "⚠️  WARNING: Potential secrets found in environment"
          } || echo "✅ No obvious secrets in environment"

      # ── 7. Report image size ─────────────────────────────────────
      - name: Report image size
        run: |
          IMAGE_SIZE=$(docker images supportflow:test --format "{{.Size}}")
          echo "📦 Docker image size: $IMAGE_SIZE"
          
          # Report but don't fail on size
          SIZE_BYTES=$(docker inspect supportflow:test --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          
          if [ $SIZE_MB -gt 500 ]; then
            echo "⚠️  WARNING: Image size (${SIZE_MB}MB) exceeds 500MB"
            echo "Consider optimizing dependencies or using smaller base images"
          else
            echo "✅ Image size is acceptable"
          fi

      # ── 8. Run Trivy vulnerability scanner ───────────────────────
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: supportflow:test
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
