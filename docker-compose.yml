services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: supportflow_user
      POSTGRES_PASSWORD: supportflow_password
      POSTGRES_DB: supportflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
